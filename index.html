  <style>

    .profile{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}.profile-avatar{width:76px;height:76px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(135deg,#234a6c,#1d5447);color:var(--mint);font-weight:950;font-size:22px}.profile h3{margin:0 0 4px;font-size:18px}

    .home-hero{overflow:hidden;padding:0}.home-photo{height:150px;position:relative;display:flex;align-items:flex-end;padding:14px;background:linear-gradient(135deg,#365c6c,#2e7f7a)}.home-photo.lake{background:linear-gradient(135deg,#1e4a68,#368f86)}.home-photo.sea{background:linear-gradient(135deg,#216b87,#75a78a)}.home-photo.mountain{background:linear-gradient(135deg,#4f5966,#7f8d76)}.home-photo.hill{background:linear-gradient(135deg,#6e5945,#8d825f)}.home-photo.city{background:linear-gradient(135deg,#55456f,#315e76)}.home-photo:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.25),transparent 19%),linear-gradient(0deg,rgba(5,16,27,.55),transparent 58%)}.home-photo-label{position:relative;z-index:1}.home-photo-label strong{display:block;font-size:20px}.home-photo-label span{font-size:10px;color:#e3f1f8}.home-body{padding:15px}.home-price{font-size:20px;font-weight:950}.home-price small{font-size:10px;color:var(--mint)}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.exchange-example{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px;align-items:center}.exchange-side{padding:13px;border-radius:17px;background:#0c1c2f;border:1px solid var(--line);min-height:104px}.exchange-side strong{display:block;font-size:13px;margin:6px 0 3px}.exchange-arrow{display:grid;place-items:center;color:var(--mint);font-size:24px}.stay-chip{display:inline-block;padding:5px 8px;border-radius:999px;background:#183c34;color:#c4f4e4;font-size:9px;font-weight:800}.house-summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}

    .modal-wrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,650px);max-height:90vh;overflow:auto;background:#0e1d31;border:1px solid #2a4966;border-radius:24px;padding:16px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.modal-head h3{margin:0;font-size:18px}.close{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#14283f;color:var(--text)}

    .action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

    .action-card:hover{border-color:#3c6c87}.action-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#193850;font-size:21px;margin-bottom:14px}
    .action-card strong{display:block;font-size:16px;margin-bottom:5px}.action-card small{display:block;color:var(--muted);font-size:11px;line-height:1.45}

    /* ===== SCAMBIOPRO V6 · POP COLOR SYSTEM ===== */
    :root{
      --bg:#fff8dc;--bg2:#eff9ff;--panel:#ffffff;--panel2:#f4f8ff;--line:#dfe9f3;
      --text:#0b2a52;--muted:#61738a;--mint:#35c76f;--blue:#168bf2;--amber:#ffd429;
      --orange:#ff7417;--red:#f04444;--shadow:0 12px 30px rgba(17,59,104,.12);--radius:22px;
    }
    body{background:linear-gradient(155deg,#ffd72b 0 26%,#ff8b25 26% 31%,#41bfff 31% 100%);color:var(--text)}
    .app{background:#fffdf8;box-shadow:0 0 70px rgba(17,59,104,.22);border-left:1px solid rgba(255,255,255,.5);border-right:1px solid rgba(255,255,255,.5)}
    .topbar{background:rgba(255,255,255,.96);border-bottom:1px solid #e7eef5;box-shadow:0 4px 18px rgba(26,75,120,.06)}
    .brand-mark{color:#fff;background:linear-gradient(145deg,#0f72e8,#31a9ff);box-shadow:0 8px 18px rgba(22,139,242,.24)}
    .brand h1{color:#0b2a52;font-weight:950}.brand h1 span{color:var(--orange)}
    .brand small{color:#738298}.demo-pill{background:#fff3b0;color:#7a5500;border-color:#ffd429}
    main{background:#fffdf8}

    .hero{overflow:visible;border:0;background:#fffdf8;box-shadow:none;padding:22px 14px 10px;position:relative}
    .hero:after{content:"☀";width:64px;height:64px;right:10px;bottom:auto;top:16px;border:0;border-radius:50%;background:#ffd429;color:#7b5600;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 18px rgba(255,180,0,.18);opacity:1}
    .hero .eyebrow{color:#168bf2;background:#e7f4ff;display:inline-block;padding:6px 9px;border-radius:999px;letter-spacing:.05em}
    .hero h2{color:#0b2a52;max-width:500px;padding-right:58px;font-size:34px;line-height:1.03}
    .hero h2 .accent-word{color:var(--orange)}
    .hero p{color:#596b80;font-size:14px;max-width:550px}.hero p b{color:#0b2a52!important}

    .section-head h3{color:#0b2a52;font-size:19px}.section-head span{color:#748499}
    .card{background:#fff;border-color:#e4ebf2;box-shadow:0 8px 24px rgba(18,58,101,.08)}
    .card.highlight{background:#fff8df;border-color:#ffe49a}
    .meta{color:#66788d}.legal-note{color:#7d8794}

    .action-grid{grid-template-columns:1fr;gap:11px}
    .action-card{position:relative;display:grid;grid-template-columns:62px 1fr 34px;column-gap:14px;align-items:center;min-height:104px;padding:16px 16px;border:0;border-radius:22px;color:#fff;box-shadow:0 10px 23px rgba(27,68,111,.15);text-align:left}
    .action-card:nth-child(1){background:linear-gradient(135deg,#168bf2,#22a4f5)}
    .action-card:nth-child(2){background:linear-gradient(135deg,#28b85f,#43ce75)}
    .action-card:nth-child(3){background:linear-gradient(135deg,#ff7417,#ff942c)}
    .action-card:after{content:"›";grid-column:3;grid-row:1 / span 2;width:34px;height:34px;border-radius:50%;background:#fff;color:#176bb5;display:grid;place-items:center;font-size:28px;font-weight:800}
    .action-card:nth-child(2):after{color:#24a354}.action-card:nth-child(3):after{color:#e65b00}
    .action-icon{grid-column:1;grid-row:1 / span 2;width:58px;height:58px;border-radius:50%;background:#fff;color:#0b2a52;font-size:27px;margin:0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
    .action-card strong{grid-column:2;font-size:19px;margin:0}.action-card small{grid-column:2;color:rgba(255,255,255,.9);font-size:11px;line-height:1.4;margin-top:2px}

    .simple-flow{gap:10px}.flow-step{background:#fff;border-color:#e8edf2;border-radius:18px;box-shadow:0 5px 16px rgba(24,65,110,.06)}
    .flow-step:nth-child(1){border-left:5px solid #35c76f}.flow-step:nth-child(2){border-left:5px solid #ff7417}.flow-step:nth-child(3){border-left:5px solid #ffd429}
    .flow-icon{background:#eaf5ff;color:#0b2a52}.flow-step:nth-child(1) .flow-icon{background:#e8f9ee}.flow-step:nth-child(2) .flow-icon{background:#fff1e7}.flow-step:nth-child(3) .flow-icon{background:#fff5b8;color:#7a5500}
    .flow-step strong{color:#0b2a52}.flow-step span{color:#6a7a8e}.flow-value{color:#168b48}.flow-step:nth-child(2) .flow-value{color:#f04e2b}
    .key-message{background:#fff3b8;border:1px solid #ffe17a;color:#5a4700}

    .sp-help{background:#eef7ff;border-color:#cce7ff}.sp-bubble{background:linear-gradient(145deg,#ffd429,#ffac00);color:#704700;box-shadow:0 6px 14px rgba(255,174,0,.22)}
    .sp-help p{color:#62758a}
    .simple-choice{background:#fff;border-color:#dce7f1;color:#0b2a52;box-shadow:0 5px 16px rgba(24,65,110,.05)}

function loadState(){try{return {...structuredClone(defaultState),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function sp(n){return new Intl.NumberFormat('it-IT').format(n)+' SP'}
function euroLike(n){return new Intl.NumberFormat('it-IT').format(n)}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+msg+'</div>';setTimeout(()=>root.innerHTML='',2600)}
function setScreen(name){current=name;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));render()}
function render(){const el=document.getElementById('screen');if(current==='home')el.innerHTML=homeHTML();if(current==='market')el.innerHTML=marketHTML();if(current==='houses')el.innerHTML=housesHTML();if(current==='match')el.innerHTML=matchHTML();if(current==='wallet')el.innerHTML=walletHTML();if(current==='profile')el.innerHTML=profileHTML();bindScreen()}

function bindScreen(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.setHouse){houseMode=b.dataset.setHouse}setScreen(b.dataset.go)});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{marketFilter=b.dataset.filter;render()});
  document.querySelectorAll('[data-match-tab]').forEach(b=>b.onclick=()=>{matchMode=b.dataset.matchTab;render()});
  document.querySelectorAll('[data-house-tab]').forEach(b=>b.onclick=()=>{houseMode=b.dataset.houseTab;render()});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyOffer(b.dataset.buy));
  document.querySelectorAll('[data-house-book]').forEach(b=>b.onclick=()=>bookHouse(b.dataset.houseBook));
  document.querySelectorAll('[data-house-swap]').forEach(b=>b.onclick=()=>swapHouse(b.dataset.houseSwap));
  document.querySelectorAll('[data-house-detail]').forEach(b=>b.onclick=()=>houseDetail(b.dataset.houseDetail));
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action,b));
  const search=document.getElementById('marketSearch'); if(search){search.addEventListener('input',applySearch);document.getElementById('marketSearchBtn').onclick=applySearch}
}
function applySearch(){const q=(document.getElementById('marketSearch').value||'').trim().toLowerCase();document.querySelectorAll('#offerList .offer').forEach(x=>x.classList.toggle('hidden',q&&!x.dataset.text.includes(q)))}
function buyOffer(id){const o=offers.find(x=>x.id===id);if(!o)return;if(state.user.balance-o.price < -state.user.limit){toast('SP disponibili insufficienti per questa operazione.');return}openModal('Richiedi servizio',`<div class="card" style="margin-bottom:12px"><h4>${o.service}</h4><div class="meta">${o.business} · ${o.area}</div></div><div class="notice">Vuoi inviare questa richiesta? Nella demo gli SP vengono scalati subito.</div><button class="btn full" id="confirmBuy">Conferma</button>`);setTimeout(()=>{const c=document.getElementById('confirmBuy');if(c)c.onclick=()=>{state.user.balance-=o.price;state.history.unshift({label:o.service+' — '+o.business,date:'Adesso · acquisto demo',value:-o.price,type:'out'});state.usedOffers.push(o.id);save();closeModal();toast('Richiesta registrata: -'+sp(o.price));render()}},0)}
function houseDetail(id){const h=houses.find(x=>x.id===id);if(!h)return;openModal(h.title,`<div class="home-photo ${h.theme}" style="border-radius:18px"><div class="home-photo-label"><span>${h.location}</span><strong>${h.title}</strong></div></div><div class="card" style="margin-top:12px"><div class="meta">Host: ${h.owner} · ★ ${h.rating}<br>Disponibilità: ${h.available}<br>Ospiti: fino a ${h.guests}<br>${h.features}</div></div><div class="notice">Valore demo: ${sp(h.night)} per notte. Cauzione e costi extra, se previsti, resterebbero separati dagli SP.</div>`)}
function bookHouse(id){const h=houses.find(x=>x.id===id);if(!h)return;const nights=5,total=h.night*nights;if(state.user.balance-total < -state.user.limit){toast('SP disponibili insufficienti per questo soggiorno.');return}openModal('Prenota con SP',`<div class="card"><h4>${h.title}</h4><div class="meta">${h.location} · ${nights} notti · ${h.available}</div><div class="balance" style="font-size:30px;margin-top:12px">${euroLike(total)} <small>SP</small></div></div><div class="notice">La demo scala gli SP subito. In un prodotto reale il credito verrebbe bloccato e trasferito secondo le regole di prenotazione.</div><button class="btn full" id="confirmHouse">Conferma soggiorno demo</button>`);setTimeout(()=>{const c=document.getElementById('confirmHouse');if(c)c.onclick=()=>{state.user.balance-=total;state.history.unshift({label:'ScambioCasa — '+h.location,date:'Adesso · '+nights+' notti demo',value:-total,type:'out'});state.houseRequests.push({id:h.id,type:'sp',total});save();closeModal();toast('Soggiorno demo richiesto: -'+sp(total));render()}},0)}
function swapHouse(id){const h=houses.find(x=>x.id===id);if(!h)return;openModal('Proponi scambio diretto',`<div class="exchange-example"><div class="exchange-side"><span class="stay-chip">Tu offri</span><strong>Casa sul Lago</strong><div class="meta">7 notti</div></div><div class="exchange-arrow">⇄</div><div class="exchange-side"><span class="stay-chip">${h.location}</span><strong>${h.title}</strong><div class="meta">${h.available}</div></div></div><div class="notice" style="margin-top:12px">Nessun SP viene mosso finché i due proprietari non accettano date e condizioni.</div><button class="btn full" id="confirmSwap">Invia proposta demo</button>`);setTimeout(()=>{const c=document.getElementById('confirmSwap');if(c)c.onclick=()=>{state.houseRequests.push({id:h.id,type:'direct'});save();closeModal();toast('Proposta di scambio inviata nella demo.')}},0)}

function handleAction(action){
  if(action==='scroll-video'){document.getElementById('video-scambiopro')?.scrollIntoView({behavior:'smooth',block:'center'})}
  if(action==='offer-wizard'){
    openModal('Cosa vuoi offrire?',`<div class="notice">Bastano tre informazioni. Questa è una simulazione: non pubblica nulla realmente.</div><label class="meta">Tipo di offerta</label><select id="offerType" class="input"><option>Servizio professionale</option><option>Lavoro artigianale</option><option>Prodotto o bene</option><option>Casa / soggiorno</option></select><label class="meta" style="display:block;margin-top:10px">Descrizione</label><input id="offerDesc" class="input" placeholder="Es. imbiancatura appartamento"><label class="meta" style="display:block;margin-top:10px">Valore richiesto</label><input id="offerValue" class="input" type="number" value="500" min="1"><button class="btn full" style="margin-top:12px" id="publishOfferV5">Pubblica offerta demo</button>`);
    setTimeout(()=>{const p=document.getElementById('publishOfferV5');if(p)p.onclick=()=>{const d=document.getElementById('offerDesc')?.value||'Nuova offerta';const v=Number(document.getElementById('offerValue')?.value||500);closeModal();toast(d+' pubblicata per '+sp(v)+' nella demo.')}},0)
  }
  if(action==='explain-sp'){
    openModal('SP spiegati senza tecnicismi',`<div class="sp-help"><div class="sp-bubble">SP</div><div><strong>Pensa agli SP come a un conto interno della rete.</strong><p>Se offri qualcosa per 1.000 SP, il tuo saldo aumenta di 1.000. Puoi poi usare quei crediti con altri membri.</p></div></div><div class="key-message"><b>Esempio:</b> lavori per Mario e ricevi 1.000 SP. Puoi spenderne 700 per una casa a Cattolica e 300 per una cena o un altro servizio. Non devi spenderli con Mario.</div><div class="legal-note">Nella demo 1 SP è solo un’unità di riferimento. Non è denaro e non è convertibile in euro.</div>`)
  }
  if(action==='show-how'){document.getElementById('come-funziona')?.scrollIntoView({behavior:'smooth',block:'start'})}
  if(action==='publish-house'){openModal('Pubblica Casa sul Lago',`<div class="card"><h4>Casa sul Lago</h4><div class="meta">Disponibilità demo: 7 notti<br>Valore suggerito: 100 SP/notte<br>Capienza: 4 ospiti</div></div><label class="meta">Periodo</label><select class="input"><option>1–8 settembre</option><option>15–22 settembre</option><option>1–8 ottobre</option></select><button class="btn full" style="margin-top:12px" id="confirmPublish">Pubblica nella demo</button>`);setTimeout(()=>{const c=document.getElementById('confirmPublish');if(c)c.onclick=()=>{closeModal();toast('Casa pubblicata nella demo: potenziale +700 SP.')}},0)}
  if(action==='accept-match'){openModal('Circuito proposto',`<div class="cycle"><div class="cycle-node"><div class="avatar">1</div><div><strong>Tu → Mario</strong><span>Prestazione odontoiatrica</span></div><div class="cycle-value">1.000 SP</div></div><div class="cycle-node"><div class="avatar">2</div><div><strong>Mario → Luca</strong><span>Imbiancatura</span></div><div class="cycle-value">1.000 SP</div></div><div class="cycle-node"><div class="avatar">3</div><div><strong>Luca → Te</strong><span>Intervento idraulico</span></div><div class="cycle-value">1.000 SP</div></div></div><div class="notice" style="margin-top:12px">In un sistema reale ogni partecipante dovrebbe accettare la propria operazione prima della chiusura.</div><button class="btn full" style="margin-top:10px" id="simulateClose">Simula chiusura</button>`);setTimeout(()=>{const x=document.getElementById('simulateClose');if(x)x.onclick=()=>{closeModal();toast('Circuito chiuso nella demo: 3 operazioni compensate.')}},0)}
  if(action==='open-second-match'){openModal('Dettaglio circuito',`<div class="match-route"><b>Tu</b> offri 650 SP di prestazioni → <b>Hotel Aurora</b> offre soggiorni → <b>Giulia</b> offre consulenza fiscale → <b>Ristorante Porto</b> offre ristorazione → il valore torna verso <b>te</b>.</div><div class="notice">Questa è una simulazione di matching, non una transazione reale.</div>`)}
  if(action==='find-cycle'){const val=Number(document.getElementById('needSelect')?.value||850);document.getElementById('simResult').innerHTML=`<div class="cycle-result" style="margin-top:12px"><span class="cycle-badge">Circuito trovato</span><div style="margin-top:8px"><b>Tu</b> acquisti per ${sp(val)} → un'attività della rete acquista da un tuo cliente o usa una tua disponibilità → il circuito si chiude con valore che torna verso di te.<br><br><b>Copertura stimata demo: 92%</b></div></div>`;toast('Circuito compatibile trovato.')}
  if(action==='edit-offer'){openModal('Modifica offerta',`<label class="meta">Servizio offerto</label><input class="input" value="Prestazioni odontoiatriche"><label class="meta" style="display:block;margin-top:10px">Raggio operativo</label><select class="input"><option>15 km</option><option selected>30 km</option><option>50 km</option></select><button class="btn full" style="margin-top:12px" id="saveOffer">Salva</button>`);setTimeout(()=>{const s=document.getElementById('saveOffer');if(s)s.onclick=()=>{closeModal();toast('Offerta demo aggiornata.')}},0)}
  if(action==='reset-demo'){localStorage.removeItem(STORAGE);state=structuredClone(defaultState);toast('Dati demo ripristinati.');render()}
}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-wrap"><section class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" id="modalClose">✕</button></div>${body}</section></div>`;document.getElementById('modalClose').onclick=closeModal;document.querySelector('.modal-wrap').addEventListener('click',e=>{if(e.target.classList.contains('modal-wrap'))closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setScreen(b.dataset.screen)));
render();
</script>
</body>
</html>
